apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stockshelf
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: junaaper/stockshelf-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: stockshelf-config
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: stockshelf-secret
              key: JWT_SECRET
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: stockshelf
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
