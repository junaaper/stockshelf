---
- name: Configure all nodes
  hosts: all
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - git
          - unzip
        state: present

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

- name: Configure master node
  hosts: master
  become: yes
  tasks:
    - name: Check kubectl version
      command: kubectl version --client --output=yaml
      register: kubectl_version
      ignore_errors: yes

    - name: Print kubectl version
      debug:
        msg: "{{ kubectl_version.stdout }}"

- name: Configure Jenkins on master
  hosts: master
  become: yes
  tasks:
    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started

    - name: Check if Jenkins container exists
      command: docker ps -a --filter name=jenkins --format "{{ '{{' }}.Names{{ '}}' }}"
      register: jenkins_check

    - name: Start Jenkins container if stopped
      command: docker start jenkins
      when: jenkins_check.stdout == "jenkins"
      ignore_errors: yes

    - name: Get Jenkins status
      command: docker inspect --format="{{ '{{' }}.State.Status{{ '}}' }}" jenkins
      register: jenkins_status
      ignore_errors: yes

    - name: Print Jenkins status
      debug:
        msg: "Jenkins is {{ jenkins_status.stdout }}"

    - name: Ensure Jenkins port is accessible
      wait_for:
        host: localhost
        port: 8080
        timeout: 30
      ignore_errors: yes

    - name: Create Jenkins workspace directory
      file:
        path: /var/jenkins_home/workspace
        state: directory
        mode: '0755'
      ignore_errors: yes

    - name: Configure Docker daemon for Jenkins
      copy:
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
        dest: /etc/docker/daemon.json
        mode: '0644'
      notify: Restart Docker

  handlers:
    - name: Restart Docker
      systemd:
        name: docker
        state: restarted
